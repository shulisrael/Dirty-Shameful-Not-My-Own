[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csa-genital-attitudes"
version = "1.0.0"
description = "Reproducible statistical analysis and figure generation for Sperber & Gewirtz-Meydan: Traumatized Sexuality as a Pathway From Childhood Sexual Abuse to Attitudes Toward Women's Genitals"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Shulamit Sperber", email = "ssperber@campus.haifa.ac.il"},
    {name = "Ateret Gewirtz-Meydan"}
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
reproduce-csa-genital-attitudes = "csa_genital_attitudes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
